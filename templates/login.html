{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-8 col-lg-5">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <div class="display-5 text-primary mb-2">
                    <i class="bi bi-tools"></i>
                </div>
                <h3 class="fw-bold text-dark">ระบบแจ้งซ่อมภายในโรงเรียน</h3>
                <p class="text-muted small">School Repair Request System (Python Edition)</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">
                        <i class="bi bi-person me-1"></i> ชื่อผู้ใช้งาน (Username)
                    </label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="ระบุ username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">
                        <i class="bi bi-lock me-1"></i> รหัสผ่าน (Password)
                    </label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="ระบุ password" required>
                </div>

                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); border: none;">
                        <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
                    </button>
                </div>
            </form>

            <div class="mt-4 pt-3 border-top">
                <div class="text-center mb-2">
                    <span class="badge bg-light text-dark border">
                        <i class="bi bi-lightning-fill text-warning"></i> บัญชีทดสอบสำหรับตรวจการบ้าน (Quick Fill)
                    </span>
                </div>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="quickFill('admin', 'admin123')">
                        <i class="bi bi-shield-lock-fill"></i> Admin
                    </button>
                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="quickFill('teacher1', 'teacher123')">
                        <i class="bi bi-mortarboard-fill"></i> ครู (Teacher)
                    </button>
                    <button type="button" class="btn btn-outline-warning text-dark btn-sm" onclick="quickFill('tech1', 'tech123')">
                        <i class="bi bi-wrench-adjustable"></i> ช่างซ่อม (Tech)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function quickFill(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    showToast('info', 'ใส่ข้อมูล ' + u + ' เรียบร้อยแล้ว');
}
</script>
{% endblock %}
