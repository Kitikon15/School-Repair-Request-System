{% extends "base.html" %}

{% block title %}เกิดข้อผิดพลาด (Error {{ error_code }}){% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5" style="min-height: 60vh;">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card card-custom p-5 border-0">
            <div class="display-1 text-warning mb-3">
                {% if error_code == 404 %}
                    <i class="bi bi-compass"></i>
                {% else %}
                    <i class="bi bi-exclamation-octagon"></i>
                {% endif %}
            </div>
            <h1 class="fw-bold text-dark mb-2">{{ error_code }}</h1>
            <h4 class="fw-semibold text-secondary mb-3">{{ error_title }}</h4>
            <p class="text-muted mb-4">{{ error_message }}</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary px-4 fw-bold shadow-sm">
                    <i class="bi bi-house-door-fill me-1"></i> กลับสู่หน้าหลัก
                </a>
                <button onclick="window.history.back()" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-arrow-left me-1"></i> ย้อนกลับ
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
